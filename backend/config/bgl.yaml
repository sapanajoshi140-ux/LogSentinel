# BGL (BlueGene/L supercomputer log dataset).
# Run:  python -m src.pipeline.evaluate --config config/bgl.yaml

dataset: bgl

drain:
  depth: 4
  sim_th: 0.3        # matches DATASET_DRAIN_PARAMS["bgl"] in src/parsing/leakage_free_parser.py
  max_clusters: null

split:
  train_frac: 0.7
  val_frac: 0.15
  # BGL has no block ID, so sequences are sliding windows. The window is set on the
  # splitter's command line (src/splitting/bgl_split.py --window-size 20 --stride 20).

detectors:
  ewma_alpha: 0.3
  ewma_threshold: 3.0
  markov_order: 1
  bilstm_hidden_dim: 64
  bilstm_window: 20   # same as the BGL window size
  bilstm_epochs: 10

dawf:
  beta: 0.5
  min_weight: 0.01

paths:
  raw_log: data/raw/BGL.log
  labels: null        # BGL labels are inside the log lines (a line not starting with "-" is an alert)
  processed_dir: data/processed/bgl_split
  artifacts_dir: artifacts/bgl
  results_dir: results/bgl